<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sintetizador de 3 notas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
        }

        .container {
            width: min(94vw, 520px);
            padding: 1.25rem;
            text-align: center;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 1rem;
            color: #fff;
            font-size: 1.25rem;
        }

        .instrument-layout {
            display: grid;
            grid-template-columns: minmax(110px, 0.8fr) minmax(170px, 1.2fr);
            gap: 0.7rem;
            align-items: center;
        }

        .sensor-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
            margin: 0;
        }

        .sensor-card {
            width: 100%;
            padding: 0.55rem 0.45rem;
            background: #0f3460;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .sensor-label {
            color: #ddd;
            font-size: 0.8rem;
        }

        .sensor-value {
            margin-top: 0.2rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .volume-indicator {
            width: 100%;
            height: 8px;
            margin: 0.45rem 0;
            overflow: hidden;
            background: #53354a;
            border-radius: 4px;
        }

        .volume-fill {
            width: 0%;
            height: 100%;
            background: #e94560;
            transition: width 0.05s linear;
        }

        .note-label {
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            min-width: 0;
        }

        .control-card {
            padding: 0.8rem;
            background: #0f3460;
            border-radius: 10px;
        }

        .control-card label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            gap: 0.4rem;
            margin-top: 0.65rem;
            color: #ddd;
            font-size: 0.68rem;
        }

        .control-card input[type="range"] {
            display: block;
            width: 100%;
            height: 28px;
            margin: 0.5rem 0;
            accent-color: #e94560;
            touch-action: pan-x;
        }

        .control-card output {
            display: block;
            color: #fff;
            font-size: 0.85rem;
        }

        button {
            width: 100%;
            margin: 1rem 0 0.7rem;
            padding: 0.9rem 1rem;
            border: 0;
            border-radius: 50px;
            background: #e94560;
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        button.off {
            background: #4a4a4a;
        }

        .status {
            min-height: 1.2em;
            color: #ccc;
            font-size: 0.9rem;
        }

        .note {
            margin-top: 0.8rem;
            color: #aaa;
            font-size: 0.75rem;
            line-height: 1.4;
        }

        @media (max-width: 360px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .instrument-layout {
                grid-template-columns: minmax(100px, 0.75fr) minmax(145px, 1.25fr);
                gap: 0.4rem;
            }

            .control-card {
                padding: 0.65rem 0.45rem;
            }

            .sensor-card {
                padding: 0.45rem 0.3rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>🎛️ Sintetizador de 3 notas</h1>

        <div class="instrument-layout">
            <section class="sensor-row" aria-label="Indicadores de movimiento y volumen">
                <div class="sensor-card">
                    <div class="sensor-label">La (XZ)</div>
                    <div class="sensor-value" id="speedGamma">0</div>
                    <div class="volume-indicator">
                        <div id="volGammaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelGamma">220 Hz</div>
                </div>

                <div class="sensor-card">
                    <div class="sensor-label">Sol (YZ)</div>
                    <div class="sensor-value" id="speedBeta">0</div>
                    <div class="volume-indicator">
                        <div id="volBetaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelBeta">196 Hz</div>
                </div>

                <div class="sensor-card">
                    <div class="sensor-label">Mi (XY)</div>
                    <div class="sensor-value" id="speedAlpha">0</div>
                    <div class="volume-indicator">
                        <div id="volAlphaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelAlpha">165 Hz</div>
                </div>
            </section>

            <section class="controls" aria-label="Controles del sintetizador">
                <div class="control-card">
                    <label for="transposeSlider">Afinación</label>
                    <div class="range-labels">
                        <span>−6 semitonos</span>
                        <span>+6 semitonos</span>
                    </div>
                    <input
                        id="transposeSlider"
                        type="range"
                        min="-6"
                        max="6"
                        step="0.1"
                        value="0"
                        aria-label="Afinación, de menos seis a más seis semitonos"
                    >
                    <output id="transposeValue" for="transposeSlider">0,0 st</output>
                </div>

                <div class="control-card">
                    <label for="volumeSpeedSlider">Respuesta del volumen</label>
                    <div class="range-labels">
                        <span>0,1 Hz · lenta</span>
                        <span>10 Hz · rápida</span>
                    </div>
                    <input
                        id="volumeSpeedSlider"
                        type="range"
                        min="0.1"
                        max="10"
                        step="0.1"
                        value="5"
                        aria-label="Rapidez de respuesta del volumen, entre 0,1 y 10 hercios"
                    >
                    <output id="volumeSpeedValue" for="volumeSpeedSlider">5,0 Hz</output>
                </div>
            </section>
        </div>

        <button id="powerButton" type="button">🔊 ENCENDER</button>
        <div class="status" id="statusText" role="status">Apagado</div>
        <div class="note">
            Gira el dispositivo en diferentes ejes para mezclar las notas.
            Usa las correderas para cambiar la afinación y la respuesta del volumen.
        </div>
    </main>

    <script>
        // Elementos de la página
        const speedGammaSpan = document.getElementById('speedGamma');
        const speedBetaSpan = document.getElementById('speedBeta');
        const speedAlphaSpan = document.getElementById('speedAlpha');

        const volGammaFill = document.getElementById('volGammaFill');
        const volBetaFill = document.getElementById('volBetaFill');
        const volAlphaFill = document.getElementById('volAlphaFill');

        const labelGamma = document.getElementById('labelGamma');
        const labelBeta = document.getElementById('labelBeta');
        const labelAlpha = document.getElementById('labelAlpha');

        const powerButton = document.getElementById('powerButton');
        const statusText = document.getElementById('statusText');

        const transposeSlider = document.getElementById('transposeSlider');
        const transposeValue = document.getElementById('transposeValue');
        const volumeSpeedSlider = document.getElementById('volumeSpeedSlider');
        const volumeSpeedValue = document.getElementById('volumeSpeedValue');

        // Audio
        let audioContext = null;
        let masterGainNode = null;
        let filterNode = null;

        const notes = {
            la: {
                gainNode: null,
                oscillators: [],
                frequencies: [220, 440, 660],
                gains: [0.5, 0.25, 0.15],
                label: labelGamma
            },
            sol: {
                gainNode: null,
                oscillators: [],
                frequencies: [196, 392, 588],
                gains: [0.5, 0.25, 0.15],
                label: labelBeta
            },
            mi: {
                gainNode: null,
                oscillators: [],
                frequencies: [165, 330, 495],
                gains: [0.5, 0.25, 0.15],
                label: labelAlpha
            }
        };

        let isOn = false;
        let motionListenerAdded = false;
        let rafId = null;

        // Velocidad angular (grados por segundo) necesaria para volumen máximo.
        const MAX_SPEED = 360;
        const SILENCE_THRESHOLD = 10;

        let lastGamma = 0;
        let lastBeta = 0;
        let lastAlpha = 0;

        function formatNumber(value, decimals = 1) {
            return Number(value).toFixed(decimals).replace('.', ',');
        }

        function updateTransposition() {
            const semitones = Number(transposeSlider.value);
            const multiplier = Math.pow(2, semitones / 12);
            const sign = semitones > 0 ? '+' : '';

            transposeValue.textContent =
                `${sign}${formatNumber(semitones)} st`;

            labelGamma.textContent = `${(220 * multiplier).toFixed(1)} Hz`;
            labelBeta.textContent = `${(196 * multiplier).toFixed(1)} Hz`;
            labelAlpha.textContent = `${(165 * multiplier).toFixed(1)} Hz`;

            if (!audioContext) return;

            const now = audioContext.currentTime;

            Object.values(notes).forEach(note => {
                note.oscillators.forEach((oscillator, index) => {
                    const frequency = note.frequencies[index] * multiplier;
                    oscillator.frequency.setTargetAtTime(frequency, now, 0.02);
                });
            });
        }

        function updateResponseLabel() {
            const responseHz = Number(volumeSpeedSlider.value);
            volumeSpeedValue.textContent = `${formatNumber(responseHz)} Hz`;
        }

        transposeSlider.addEventListener('input', updateTransposition);
        volumeSpeedSlider.addEventListener('input', updateResponseLabel);

        async function initAudio() {
            if (audioContext) return true;

            try {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (!AudioContextClass) {
                    throw new Error('Este navegador no admite Web Audio.');
                }

                audioContext = new AudioContextClass({
                    latencyHint: 'interactive'
                });

                filterNode = audioContext.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 2000;
                filterNode.Q.value = 0.7;

                masterGainNode = audioContext.createGain();
                masterGainNode.gain.value = 0.5;

                masterGainNode.connect(filterNode);
                filterNode.connect(audioContext.destination);

                for (const note of Object.values(notes)) {
                    note.gainNode = audioContext.createGain();
                    note.gainNode.gain.value = 0;
                    note.gainNode.connect(masterGainNode);

                    note.oscillators = [];

                    note.frequencies.forEach((frequency, index) => {
                        const oscillator = audioContext.createOscillator();
                        const oscillatorGain = audioContext.createGain();

                        oscillator.type = 'sine';
                        oscillator.frequency.value = frequency;
                        oscillatorGain.gain.value = note.gains[index];

                        oscillator.connect(oscillatorGain);
                        oscillatorGain.connect(note.gainNode);
                        oscillator.start();

                        note.oscillators.push(oscillator);
                    });
                }

                updateTransposition();

                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                return true;
            } catch (error) {
                console.error('Error al inicializar el audio:', error);
                statusText.textContent = 'No se pudo iniciar el audio.';
                stopAudio();
                return false;
            }
        }

        function stopAudio() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }

            for (const note of Object.values(notes)) {
                note.oscillators.forEach(oscillator => {
                    try {
                        oscillator.stop();
                        oscillator.disconnect();
                    } catch (error) {
                        // El oscilador puede haberse detenido ya.
                    }
                });

                note.oscillators = [];

                if (note.gainNode) {
                    note.gainNode.disconnect();
                    note.gainNode = null;
                }
            }

            if (masterGainNode) {
                masterGainNode.disconnect();
                masterGainNode = null;
            }

            if (filterNode) {
                filterNode.disconnect();
                filterNode = null;
            }

            if (audioContext) {
                const oldContext = audioContext;
                audioContext = null;
                oldContext.close().catch(error => {
                    console.warn('No se pudo cerrar el contexto de audio:', error);
                });
            }
        }

        function updateAudioAndUI() {
            if (!isOn || !audioContext) {
                rafId = null;
                return;
            }

            const now = audioContext.currentTime;
            const responseHz = Number(volumeSpeedSlider.value);

            // Convierte el ajuste en Hz en una constante de suavizado
            // para Web Audio. Más Hz significa respuesta más rápida.
            const responseTime = 1 / (2 * Math.PI * responseHz);

            const gamma = lastGamma;
            const beta = lastBeta;
            const alpha = lastAlpha;

            speedGammaSpan.textContent = Math.round(gamma);
            speedBetaSpan.textContent = Math.round(beta);
            speedAlphaSpan.textContent = Math.round(alpha);

            let volumeGamma = Math.min(gamma / MAX_SPEED, 1);
            let volumeBeta = Math.min(beta / MAX_SPEED, 1);
            let volumeAlpha = Math.min(alpha / MAX_SPEED, 1);

            if (gamma < SILENCE_THRESHOLD) volumeGamma = 0;
            if (beta < SILENCE_THRESHOLD) volumeBeta = 0;
            if (alpha < SILENCE_THRESHOLD) volumeAlpha = 0;

            if (notes.la.gainNode) {
                notes.la.gainNode.gain.setTargetAtTime(
                    volumeGamma,
                    now,
                    responseTime
                );
            }

            if (notes.sol.gainNode) {
                notes.sol.gainNode.gain.setTargetAtTime(
                    volumeBeta,
                    now,
                    responseTime
                );
            }

            if (notes.mi.gainNode) {
                notes.mi.gainNode.gain.setTargetAtTime(
                    volumeAlpha,
                    now,
                    responseTime
                );
            }

            volGammaFill.style.width = `${volumeGamma * 100}%`;
            volBetaFill.style.width = `${volumeBeta * 100}%`;
            volAlphaFill.style.width = `${volumeAlpha * 100}%`;

            rafId = requestAnimationFrame(updateAudioAndUI);
        }

        function handleMotion(event) {
            if (!isOn || !event.rotationRate) return;

            const rotation = event.rotationRate;
            lastGamma = Math.abs(rotation.gamma || 0);
            lastBeta = Math.abs(rotation.beta || 0);
            lastAlpha = Math.abs(rotation.alpha || 0);
        }

        async function requestMotionPermission() {
            if (motionListenerAdded) return true;

            if (typeof DeviceMotionEvent === 'undefined') {
                statusText.textContent =
                    'Este navegador no ofrece datos de movimiento.';
                return false;
            }

            try {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    const permission = await DeviceMotionEvent.requestPermission();

                    if (permission !== 'granted') {
                        statusText.textContent =
                            'Permiso de movimiento denegado; el audio sigue disponible.';
                        return false;
                    }
                }

                window.addEventListener('devicemotion', handleMotion);
                motionListenerAdded = true;
                return true;
            } catch (error) {
                console.error('No se pudo obtener permiso de movimiento:', error);
                statusText.textContent =
                    'No se pudo acceder al sensor de movimiento.';
                return false;
            }
        }

        powerButton.addEventListener('click', async () => {
            if (isOn) {
                isOn = false;
                stopAudio();

                powerButton.textContent = '🔊 ENCENDER';
                powerButton.classList.remove('off');
                statusText.textContent = 'Apagado';

                lastGamma = 0;
                lastBeta = 0;
                lastAlpha = 0;

                speedGammaSpan.textContent = '0';
                speedBetaSpan.textContent = '0';
                speedAlphaSpan.textContent = '0';

                volGammaFill.style.width = '0%';
                volBetaFill.style.width = '0%';
                volAlphaFill.style.width = '0%';
                return;
            }

            // Solicitar permiso directamente desde la acción del usuario,
            // como requieren algunos navegadores móviles.
            const motionPermission = requestMotionPermission();
            const audioReady = await initAudio();

            if (!audioReady) return;

            isOn = true;
            const motionReady = await motionPermission;

            powerButton.textContent = '🔇 APAGAR';
            powerButton.classList.add('off');

            statusText.textContent = motionReady
                ? 'Encendido — gira el dispositivo'
                : 'Audio encendido; sensor de movimiento no disponible';

            if (rafId === null) {
                rafId = requestAnimationFrame(updateAudioAndUI);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (rafId !== null) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }

                lastGamma = 0;
                lastBeta = 0;
                lastAlpha = 0;

                if (isOn && audioContext) {
                    const now = audioContext.currentTime;

                    Object.values(notes).forEach(note => {
                        if (note.gainNode) {
                            note.gainNode.gain.setTargetAtTime(0, now, 0.02);
                        }
                    });
                }

                return;
            }

            if (isOn && audioContext && rafId === null) {
                rafId = requestAnimationFrame(updateAudioAndUI);
            }
        });

        updateTransposition();
        updateResponseLabel();
    </script>
</body>
</html>
