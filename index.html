<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sintetizador 3 Notas - Baja Latencia</title>
    <style>
        /* Mismos estilos que antes, puedes copiarlos de tu versión anterior */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #0f3460;
        }
        .sensor-row {
            display: flex;
            justify-content: space-around;
            margin: 0.5rem 0;
        }
        .sensor-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 0.5rem;
            width: 30%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .sensor-label {
            font-size: 0.8rem;
            color: #aaa;
        }
        .sensor-value {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .volume-indicator {
            width: 100%;
            height: 8px;
            background: #53354a;
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .volume-fill {
            height: 100%;
            width: 0%;
            background: #e94560;
            transition: width 0.05s ease;
        }
        .note-label {
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem 0;
            width: 100%;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.off {
            background: #4a4a4a;
        }
        .status {
            font-size: 1rem;
            color: #aaa;
        }
        .note {
            font-size: 0.7rem;
            color: #888;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Sintetizador 3 Notas - Baja Latencia</h1>
        <div class="sensor-row">
            <div class="sensor-card">
                <div class="sensor-label">La (XZ)</div>
                <div class="sensor-value" id="speedGamma">0</div>
                <div class="volume-indicator">
                    <div id="volGammaFill" class="volume-fill"></div>
                </div>
                <div class="note-label">220 Hz</div>
            </div>
            <div class="sensor-card">
                <div class="sensor-label">Sol (YZ)</div>
                <div class="sensor-value" id="speedBeta">0</div>
                <div class="volume-indicator">
                    <div id="volBetaFill" class="volume-fill"></div>
                </div>
                <div class="note-label">196 Hz</div>
            </div>
            <div class="sensor-card">
                <div class="sensor-label">Mi (XY)</div>
                <div class="sensor-value" id="speedAlpha">0</div>
                <div class="volume-indicator">
                    <div id="volAlphaFill" class="volume-fill"></div>
                </div>
                <div class="note-label">165 Hz</div>
            </div>
        </div>
        <button id="powerButton">🔊 ENCENDER</button>
        <div class="status" id="statusText">Apagado</div>
        <div class="note">Gira el dispositivo en diferentes ejes para mezclar las notas. Baja latencia con AudioWorklet.</div>
    </div>

    <!-- Cargamos el script principal -->
    <script src="main.js"></script>
</body>
</html>
