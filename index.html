<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sintetizador por Giro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none; /* Evita desplazamientos mientras se interactúa */
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #0f3460;
        }
        .speed-meter {
            font-size: 2rem;
            margin: 1rem 0;
            padding: 1rem;
            background: #0f3460;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .volume-indicator {
            width: 100%;
            height: 30px;
            background: #53354a;
            border-radius: 15px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .volume-fill {
            height: 100%;
            width: 0%;
            background: #e94560;
            transition: width 0.1s ease;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem 0;
            width: 100%;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.off {
            background: #4a4a4a;
        }
        .status {
            font-size: 1rem;
            color: #aaa;
        }
        .note {
            font-size: 0.8rem;
            color: #888;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Sintetizador por Giro</h1>
        <div class="speed-meter">
            <span id="speedValue">0</span> °/s
        </div>
        <div class="volume-indicator">
            <div id="volumeFill" class="volume-fill"></div>
        </div>
        <button id="powerButton">🔊 ENCENDER</button>
        <div class="status" id="statusText">Apagado</div>
        <div class="note">Gira el dispositivo sobre su eje vertical (como una peonza) para controlar el volumen.</div>
    </div>

    <script>
        // Elementos del DOM
        const speedSpan = document.getElementById('speedValue');
        const volumeFill = document.getElementById('volumeFill');
        const powerButton = document.getElementById('powerButton');
        const statusText = document.getElementById('statusText');

        // Variables de audio
        let audioContext = null;
        let gainNode = null;
        let oscillators = [];
        let isOn = false;

        // Frecuencias: fundamental 440 Hz, armónicos 880 Hz y 1320 Hz
        const frequencies = [440, 880, 1320];
        // Amplitudes relativas (para que no sature)
        const gains = [0.5, 0.25, 0.15];

        // Configuración del mapeo velocidad -> volumen
        const MAX_SPEED = 360; // grados/segundo (una vuelta por segundo = volumen máximo)
        let currentSpeed = 0;

        // Función para inicializar el audio (se llama al encender)
        async function initAudio() {
            if (audioContext) return;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Crear nodo de ganancia principal
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0; // Comienza en silencio
                gainNode.connect(audioContext.destination);

                // Crear osciladores para cada frecuencia
                for (let i = 0; i < frequencies.length; i++) {
                    const osc = audioContext.createOscillator();
                    osc.type = 'sine'; // Onda senoidal pura para cada armónico
                    osc.frequency.value = frequencies[i];

                    // Crear un nodo de ganancia individual para ajustar el volumen del armónico
                    const oscGain = audioContext.createGain();
                    oscGain.gain.value = gains[i];

                    // Conectar: oscilador -> su ganancia -> ganancia principal
                    osc.connect(oscGain);
                    oscGain.connect(gainNode);

                    osc.start();
                    oscillators.push(osc);
                }

                // Reanudar el contexto si está suspendido (necesario en algunos navegadores)
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

            } catch (e) {
                console.error('Error al inicializar audio:', e);
                alert('No se pudo inicializar el audio. Asegúrate de usar un navegador compatible.');
            }
        }

        // Función para detener el audio
        function stopAudio() {
            if (oscillators.length > 0) {
                oscillators.forEach(osc => {
                    try {
                        osc.stop();
                        osc.disconnect();
                    } catch (e) {}
                });
                oscillators = [];
            }
            if (gainNode) {
                gainNode.disconnect();
                gainNode = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // Manejar el botón de encendido/apagado
        powerButton.addEventListener('click', async () => {
            if (!isOn) {
                // Encender
                await initAudio();
                if (audioContext) {
                    isOn = true;
                    powerButton.textContent = '🔇 APAGAR';
                    powerButton.classList.add('off');
                    statusText.textContent = 'Encendido - Gira el dispositivo';
                }
            } else {
                // Apagar
                stopAudio();
                isOn = false;
                powerButton.textContent = '🔊 ENCENDER';
                powerButton.classList.remove('off');
                statusText.textContent = 'Apagado';
                // Resetear visualización de volumen a 0
                volumeFill.style.width = '0%';
                gainNode = null; // ya no hay nodo
            }
        });

        // Función para solicitar permisos de movimiento (necesario en iOS 13+)
        function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                // iOS 13+
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                        } else {
                            alert('Permiso denegado para usar el giroscopio.');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android / otros
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        // Manejador de eventos de movimiento
        function handleMotion(event) {
            if (!isOn || !audioContext || !gainNode) return;

            const rotation = event.rotationRate;
            if (!rotation) return;

            // Usamos la velocidad de giro alrededor del eje Y (gamma)
            // gamma: rotación izquierda/derecha (en grados/segundo)
            let speed = Math.abs(rotation.gamma || 0);
            // Algunos dispositivos pueden dar valores nulos
            if (isNaN(speed)) speed = 0;

            // Actualizar UI
            currentSpeed = speed;
            speedSpan.textContent = Math.round(speed);

            // Mapear velocidad a volumen (0 a 1)
            let volume = Math.min(speed / MAX_SPEED, 1.0);
            // Actualizar el nodo de ganancia
            gainNode.gain.value = volume;

            // Actualizar barra de volumen
            volumeFill.style.width = (volume * 100) + '%';
        }

        // Iniciar la escucha de movimiento al cargar la página
        // Nota: en algunos navegadores se necesita interacción del usuario para recibir eventos,
        // así que lo atamos al clic del botón también.
        window.addEventListener('load', () => {
            // Intento automático, pero puede fallar en iOS
            requestMotionPermission();
        });

        // Reintentar si el botón se pulsa y no hay evento aún
        powerButton.addEventListener('click', () => {
            // Si ya hay listener, no duplicar
            if (!window.hasMotionListener) {
                window.hasMotionListener = true;
                requestMotionPermission();
            }
        });

        // Opcional: pausar cuando la página no es visible para ahorrar batería
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isOn) {
                // Silenciar mientras no se ve (opcional)
                if (gainNode) gainNode.gain.value = 0;
            }
        });
    </script>
</body>
</html>
