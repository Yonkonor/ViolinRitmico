<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sintetizador 3 Notas - Baja Latencia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 440px;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #0f3460;
        }
        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 58px;
            gap: 0.5rem;
            align-items: stretch;
        }
        .sensor-row {
            display: flex;
            justify-content: space-around;
            margin: 0.5rem 0;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sensor-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .sensor-label {
            font-size: 0.8rem;
            color: #aaa;
        }
        .sensor-value {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .volume-indicator {
            width: 100%;
            height: 8px;
            background: #53354a;
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .volume-fill {
            height: 100%;
            width: 0%;
            background: #e94560;
            transition: width 0.05s ease;
        }
        .note-label {
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }
        .tuning-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            min-width: 0;
            background: #0f3460;
            border-radius: 10px;
            padding: 0.5rem 0.2rem;
        }
        .tuning-control label,
        .octave-mark,
        .tuning-control output {
            font-size: 0.7rem;
            color: #ddd;
            text-align: center;
        }
        #transposeSlider {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 32px;
            height: 230px;
            margin: 0;
            accent-color: #e94560;
            touch-action: none;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem 0;
            width: 100%;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.off {
            background: #4a4a4a;
        }
        .status {
            font-size: 1rem;
            color: #aaa;
        }
        .note {
            font-size: 0.7rem;
            color: #888;
            margin-top: 1rem;
        }

        @media (orientation: portrait) and (max-width: 600px) {
            .main-layout .sensor-row {
                flex-direction: column;
                gap: 0.4rem;
                margin: 0;
            }

            .main-layout .sensor-card {
                box-sizing: border-box;
                width: 100%;
                padding: 0.4rem;
            }

            #transposeSlider {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Sintetizador 3 Notas - Baja Latencia</h1>

        <div class="main-layout">
            <div class="sensor-row">
                <div class="sensor-card">
                    <div class="sensor-label">La (XZ)</div>
                    <div class="sensor-value" id="speedGamma">0</div>
                    <div class="volume-indicator">
                        <div id="volGammaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelGamma">220 Hz</div>
                </div>

                <div class="sensor-card">
                    <div class="sensor-label">Sol (YZ)</div>
                    <div class="sensor-value" id="speedBeta">0</div>
                    <div class="volume-indicator">
                        <div id="volBetaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelBeta">196 Hz</div>
                </div>

                <div class="sensor-card">
                    <div class="sensor-label">Mi (XY)</div>
                    <div class="sensor-value" id="speedAlpha">0</div>
                    <div class="volume-indicator">
                        <div id="volAlphaFill" class="volume-fill"></div>
                    </div>
                    <div class="note-label" id="labelAlpha">165 Hz</div>
                </div>
            </div>

            <div class="tuning-control">
                <label for="transposeSlider">Afinación</label>
                <span class="octave-mark">+6</span>
                <input
                    id="transposeSlider"
                    type="range"
                    min="-6"
                    max="6"
                    step="0.1"
                    value="0"
                    aria-label="Desplazar las notas hasta una octava"
                >
                <span class="octave-mark">−6</span>
                <output id="transposeValue" for="transposeSlider">0 st</output>
            </div>
        </div>

        <button id="powerButton">🔊 ENCENDER</button>
        <div class="status" id="statusText">Apagado</div>
        <div class="note">Gira el dispositivo en diferentes ejes para mezclar las notas. Respuesta ultrarrápida.</div>
    </div>

    <script>
        const speedGammaSpan = document.getElementById('speedGamma');
        const speedBetaSpan = document.getElementById('speedBeta');
        const speedAlphaSpan = document.getElementById('speedAlpha');
        const volGammaFill = document.getElementById('volGammaFill');
        const volBetaFill = document.getElementById('volBetaFill');
        const volAlphaFill = document.getElementById('volAlphaFill');
        const powerButton = document.getElementById('powerButton');
        const statusText = document.getElementById('statusText');
        const transposeSlider = document.getElementById('transposeSlider');
        const transposeValue = document.getElementById('transposeValue');
        const labelGamma = document.getElementById('labelGamma');
        const labelBeta = document.getElementById('labelBeta');
        const labelAlpha = document.getElementById('labelAlpha');

        let audioContext = null;
        let masterGainNode = null;
        let filterNode = null;

        const notes = {
            la: {
                gainNode: null,
                oscillators: [],
                frequencies: [220, 440, 660],
                gains: [0.5, 0.25, 0.15],
                label: labelGamma
            },
            sol: {
                gainNode: null,
                oscillators: [],
                frequencies: [196, 392, 588],
                gains: [0.5, 0.25, 0.15],
                label: labelBeta
            },
            mi: {
                gainNode: null,
                oscillators: [],
                frequencies: [165, 330, 495],
                gains: [0.5, 0.25, 0.15],
                label: labelAlpha
            }
        };

        let isOn = false;
        const MAX_SPEED = 360;
        const threshold = 10;

        let lastGamma = 0, lastBeta = 0, lastAlpha = 0;
        let rafId = null;

        function updateNoteLabels() {
            const semitones = Number(transposeSlider.value);
            const centerMult = Math.pow(2, semitones / 12);

            const showFrequency = (base, idx) => {
                const value = base * centerMult;
                return `${value.toFixed(0)} Hz`;
            };

            labelGamma.textContent = `${showFrequency(220, 0)}`;
            labelBeta.textContent = `${showFrequency(196, 0)}`;
            labelAlpha.textContent = `${showFrequency(165, 0)}`;
        }

        function applyTransposition() {
            const semitones = Number(transposeSlider.value);
            const sign = semitones > 0 ? '+' : '';
            transposeValue.textContent = `${sign}${semitones.toFixed(1)} st`;

            updateNoteLabels();

            if (!audioContext) return;

            const now = audioContext.currentTime;
            const multiplier = Math.pow(2, semitones / 12);

            Object.values(notes).forEach(note => {
                note.oscillators.forEach((oscillator, index) => {
                    const frequency = note.frequencies[index] * multiplier;
                    oscillator.frequency.setTargetAtTime(frequency, now, 0.02);
                });
            });
        }

        transposeSlider.addEventListener('input', applyTransposition);

        async function initAudio() {
            if (audioContext) return;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });

                filterNode = audioContext.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 2000;
                filterNode.Q.value = 0.7;

                masterGainNode = audioContext.createGain();
                masterGainNode.gain.value = 0.5;

                masterGainNode.connect(filterNode);
                filterNode.connect(audioContext.destination);

                for (let noteName in notes) {
                    const note = notes[noteName];
                    const gainNode = audioContext.createGain();
                    gainNode.gain.value = 0;
                    gainNode.connect(masterGainNode);
                    note.gainNode = gainNode;

                    for (let i = 0; i < note.frequencies.length; i++) {
                        const osc = audioContext.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = note.frequencies[i];

                        const oscGain = audioContext.createGain();
                        oscGain.gain.value = note.gains[i];

                        osc.connect(oscGain);
                        oscGain.connect(gainNode);
                        osc.start();
                        note.oscillators.push(osc);
                    }
                }

                applyTransposition();

                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
            } catch (e) {
                console.error('Error al inicializar audio:', e);
                alert('No se pudo inicializar el audio.');
            }
        }

        function stopAudio() {
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }

            for (let noteName in notes) {
                const note = notes[noteName];
                note.oscillators.forEach(osc => {
                    try {
                        osc.stop();
                        osc.disconnect();
                    } catch (e) {}
                });
                note.oscillators = [];
                if (note.gainNode) {
                    note.gainNode.disconnect();
                    note.gainNode = null;
                }
            }

            if (masterGainNode) {
                masterGainNode.disconnect();
                masterGainNode = null;
            }
            if (filterNode) {
                filterNode.disconnect();
                filterNode = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        function updateAudioAndUI() {
            if (!isOn || !audioContext) {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                return;
            }

            const now = audioContext.currentTime;
            const attackTime = 0.01;
            const releaseTime = 0.01;

            let gamma = lastGamma, beta = lastBeta, alpha = lastAlpha;

            speedGammaSpan.textContent = Math.round(gamma);
            speedBetaSpan.textContent = Math.round(beta);
            speedAlphaSpan.textContent = Math.round(alpha);

            let volGamma = Math.min(gamma / MAX_SPEED, 1.0);
            let volBeta = Math.min(beta / MAX_SPEED, 1.0);
            let volAlpha = Math.min(alpha / MAX_SPEED, 1.0);

            if (gamma < threshold) volGamma = 0;
            if (beta < threshold) volBeta = 0;
            if (alpha < threshold) volAlpha = 0;

            if (notes.la.gainNode) {
                notes.la.gainNode.gain.setTargetAtTime(volGamma, now, volGamma > 0 ? attackTime : releaseTime);
            }
            if (notes.sol.gainNode) {
                notes.sol.gainNode.gain.setTargetAtTime(volBeta, now, volBeta > 0 ? attackTime : releaseTime);
            }
            if (notes.mi.gainNode) {
                notes.mi.gainNode.gain.setTargetAtTime(volAlpha, now, volAlpha > 0 ? attackTime : releaseTime);
            }

            volGammaFill.style.width = (volGamma * 100) + '%';
            volBetaFill.style.width = (volBeta * 100) + '%';
            volAlphaFill.style.width = (volAlpha * 100) + '%';

            rafId = requestAnimationFrame(updateAudioAndUI);
        }

        function handleMotion(event) {
            if (!isOn) return;

            const rotation = event.rotationRate;
            if (!rotation) return;

            lastGamma = Math.abs(rotation.gamma || 0);
            lastBeta = Math.abs(rotation.beta || 0);
            lastAlpha = Math.abs(rotation.alpha || 0);
        }

        function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                        } else {
                            alert('Permiso denegado para usar el giroscopio.');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        powerButton.addEventListener('click', async () => {
            if (!isOn) {
                await initAudio();
                if (audioContext) {
                    isOn = true;
                    powerButton.textContent = '🔇 APAGAR';
                    powerButton.classList.add('off');
                    statusText.textContent = 'Encendido - Gira el dispositivo';

                    if (!rafId) {
                        rafId = requestAnimationFrame(updateAudioAndUI);
                    }
                }
            } else {
                stopAudio();
                isOn = false;
                powerButton.textContent = '🔊 ENCENDER';
                powerButton.classList.remove('off');
                statusText.textContent = 'Apagado';
                volGammaFill.style.width = '0%';
                volBetaFill.style.width = '0%';
                volAlphaFill.style.width = '0%';
                speedGammaSpan.textContent = '0';
                speedBetaSpan.textContent = '0';
                speedAlphaSpan.textContent = '0';
            }
        });

        window.addEventListener('load', () => {
            requestMotionPermission();
            updateNoteLabels();
        });

        powerButton.addEventListener('click', () => {
            if (!window.hasMotionListener) {
                window.hasMotionListener = true;
                requestMotionPermission();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                if (isOn && audioContext) {
                    const now = audioContext.currentTime;
                    if (notes.la.gainNode) notes.la.gainNode.gain.setTargetAtTime(0, now, 0.01);
                    if (notes.sol.gainNode) notes.sol.gainNode.gain.setTargetAtTime(0, now, 0.01);
                    if (notes.mi.gainNode) notes.mi.gainNode.gain.setTargetAtTime(0, now, 0.01);
                }
            } else {
                if (isOn && audioContext && !rafId) {
                    rafId = requestAnimationFrame(updateAudioAndUI);
                }
            }
        });
    </script>
</body>
</html>
