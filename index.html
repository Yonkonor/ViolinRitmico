<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sintetizador por Giro · Acordes 7 (baja latencia)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; min-height: 100vh; background: #1a1e2c;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            touch-action: none;
        }
        .app { width: 100%; max-width: 400px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .canvas-container { background: #2d3349; border-radius: 32px; padding: 16px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: auto;
            border-radius: 24px; background: #0b0e14; touch-action: none; cursor: grab; }
        canvas:active { cursor: grabbing; }
        .chord-label {
            color: #e0e5f0; font-size: 2.2rem; font-weight: 600; letter-spacing: 4px;
            text-shadow: 0 2px 5px #00000060; background: #252b3d;
            padding: 8px 30px; border-radius: 60px; width: fit-content; margin: 5px 0;
        }
        .power-btn {
            background: #3a415a; border: none; border-radius: 80px;
            padding: 16px 48px; color: white; font-size: 1.8rem; font-weight: bold;
            letter-spacing: 2px; box-shadow: 0 8px 0 #1e212c, 0 10px 20px black;
            transition: all 0.08s ease; text-transform: uppercase;
            touch-action: manipulation; width: fit-content;
        }
        .power-btn.on {
            background: #4c6b4f; box-shadow: 0 4px 0 #2a3a2c, 0 10px 20px black;
            transform: translateY(4px);
        }
        .info {
            color: #a4b0cd; font-size: 0.85rem; text-align: center;
            background: #252b3d80; padding: 10px 20px; border-radius: 40px;
            backdrop-filter: blur(2px); line-height: 1.5;
        }
        .latency {
            color: #7fd1a0; font-size: 0.75rem; font-family: monospace;
            background: #1a2a20; padding: 4px 12px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="canvas-container">
            <canvas id="sliderCanvas" width="300" height="300"></canvas>
        </div>
        <div class="chord-label" id="chordDisplay">A7</div>
        <button class="power-btn" id="powerBtn">OFF</button>
        <div class="info">
            Gira el teléfono en los ejes XZ, YZ, XY<br>
            Umbral mínimo evita sonido en reposo
        </div>
        <div class="latency" id="latencyInfo">latencia: --</div>
    </div>
    <script>
    (function(){
        // ========== CONFIGURACIÓN ==========
        const MAX_ROTATION_SPEED    = 5.0;    // rad/s → gain 1
        const MIN_SPEED_THRESHOLD   = 0.2;    // umbral para silenciar
        const VOLUME_RAMP_TIME      = 0.020;  // 20 ms → antes 50 ms (τ)
        const FREQ_RAMP_TIME        = 0.010;  // 10 ms al cambiar acorde
        const MASTER_RAMP_TIME      = 0.015;  // 15 ms al encender

        const CHORDS = {
            'A7': [220.00, 277.18, 392.00],   // A3, C#4, G4
            'D7': [293.66, 369.99, 523.25],   // D4, F#4, C5
            'E7': [329.63, 415.30, 587.33]    // E4, G#4, D5
        };

        // ========== ESTADO ==========
        let audioContext   = null;
        let masterGain     = null;
        let notes          = [];
        let currentChord   = 'A7';
        let rotX = 0, rotY = 0, rotZ = 0;
        let powerOn        = false;
        let prewarmed      = false;      // ← nuevo: pre-calentado del contexto
        let motionListenerActive = false;

        const canvas        = document.getElementById('sliderCanvas');
        const ctx2d         = canvas.getContext('2d');
        const chordDisplay  = document.getElementById('chordDisplay');
        const powerBtn      = document.getElementById('powerBtn');
        const latencyInfo   = document.getElementById('latencyInfo');

        // ========== CURVA BEZIER ==========
        const P0 = { x: 150, y: 150 };
        const P2 = { x: 300, y: 0 };
        const P1 = { x: 300, y: 150 };

        let handleT = 0.0;
        const handleRadius = 18;

        // ========== HELPERS DE AUDIO (cancelAndHoldAtTime con fallback) ==========
        function holdParam(param, when) {
            if (typeof param.cancelAndHoldAtTime === 'function') {
                param.cancelAndHoldAtTime(when);
            } else {
                param.cancelScheduledValues(when);
                param.setValueAtTime(param.value, when);
            }
        }

        // ========== CLASE NOTE ==========
        class NoteOscillators {
            constructor(context, baseFreq, harmonicGains = [0.7, 0.4, 0.2]) {
                this.context = context;
                this.baseFreq = baseFreq;
                this.outputGain = context.createGain();
                this.outputGain.gain.value = 0;
                this.oscillators = [];
                this.harmonicGains = harmonicGains;

                for (let i = 0; i < 3; i++) {
                    const osc  = context.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = baseFreq * (i + 1);

                    const g = context.createGain();
                    g.gain.value = harmonicGains[i];

                    osc.connect(g);
                    g.connect(this.outputGain);
                    osc.start();
                    this.oscillators.push(osc);
                }
            }

            // 🟠 cancelAndHold + linearRamp → sin cola asintótica, sin clicks
            setBaseFrequency(newBase) {
                this.baseFreq = newBase;
                const now = this.context.currentTime;
                for (let i = 0; i < 3; i++) {
                    const targetFreq = newBase * (i + 1);
                    const f = this.oscillators[i].frequency;
                    holdParam(f, now);
                    f.linearRampToValueAtTime(targetFreq, now + FREQ_RAMP_TIME);
                }
            }

            // 🟠/🟡 linearRamp de 20 ms con cancelAndHold → respuesta determinista
            setVolume(vol) {
                const now = this.context.currentTime;
                const p = this.outputGain.gain;
                holdParam(p, now);
                p.linearRampToValueAtTime(vol, now + VOLUME_RAMP_TIME);
            }

            connect(dest) { this.outputGain.connect(dest); }
        }

        // ========== CREACIÓN DEL GRAFO (síncrona, idempotente) ==========
        function createAudioGraph() {
            if (audioContext) return;

            // 🟡 SIN sampleRate: deja que el SO elija el nativo (evita re-muestreo)
            audioContext = new (window.AudioContext || window.webkitAudioContext)({
                latencyHint: 'interactive'
            });

            masterGain = audioContext.createGain();
            masterGain.gain.value = 0;
            masterGain.connect(audioContext.destination);

            const freqs = CHORDS[currentChord];
            const harm  = [0.7, 0.4, 0.2];
            for (let i = 0; i < 3; i++) {
                const note = new NoteOscillators(audioContext, freqs[i], harm);
                note.connect(masterGain);
                notes.push(note);
            }

            // Diagnóstico de latencia real
            const base   = audioContext.baseLatency   ? (audioContext.baseLatency   * 1000).toFixed(1) : '?';
            const output = audioContext.outputLatency ? (audioContext.outputLatency * 1000).toFixed(1) : '?';
            latencyInfo.textContent = `latencia: base ${base} ms + out ${output} ms`;
        }

        // 🟠/🔴 Pre-calentar en el primer pointerdown (capturado antes del click)
        async function prewarmAudio() {
            if (prewarmed) return;
            prewarmed = true;
            createAudioGraph();
            if (audioContext.state === 'suspended') {
                try { await audioContext.resume(); } catch (e) { /* noop */ }
            }
        }
        document.addEventListener('pointerdown', prewarmAudio, { once: true, capture: true });
        document.addEventListener('touchstart', prewarmAudio, { once: true, capture: true, passive: true });

        // ========== CAMBIO DE ACORDE (🟠 con guard) ==========
        function setChord(chordName) {
            if (chordName === currentChord) return;   // ← evita re-programar 9 params @60fps
            if (!CHORDS[chordName] || !notes.length) return;
            currentChord = chordName;
            chordDisplay.innerText = chordName;
            const f = CHORDS[chordName];
            for (let i = 0; i < 3; i++) notes[i].setBaseFrequency(f[i]);
        }

        // ========== VOLUMEN DESDE EL GIRO (🟡 llamada desde devicemotion) ==========
        function updateVolumesFromRotation() {
            if (!powerOn || !notes.length || !audioContext) return;

            const totalSpeed = Math.abs(rotX) + Math.abs(rotY) + Math.abs(rotZ);
            let targets = [0, 0, 0];

            if (totalSpeed >= MIN_SPEED_THRESHOLD) {
                targets[0] = Math.min(1, Math.abs(rotY) / MAX_ROTATION_SPEED); // XZ → fundamental
                targets[1] = Math.min(1, Math.abs(rotX) / MAX_ROTATION_SPEED); // YZ → tercera
                targets[2] = Math.min(1, Math.abs(rotZ) / MAX_ROTATION_SPEED); // XY → séptima
                targets = targets.map(g => Math.pow(g, 1.2));
            }

            for (let i = 0; i < 3; i++) notes[i].setVolume(targets[i]);
        }

        // ========== SENSOR (🟡 aquí se aplica el volumen, sin rAF) ==========
        function handleDeviceMotion(event) {
            const rot = event.rotationRate;
            if (!rot) return;
            rotZ = rot.alpha ?? 0;
            rotX = rot.beta  ?? 0;
            rotY = rot.gamma ?? 0;

            if (powerOn) updateVolumesFromRotation();
        }

        function startMotionListener() {
            if (motionListenerActive) return;
            motionListenerActive = true;
            if (!window.DeviceMotionEvent) { alert('Este dispositivo no soporta eventos de movimiento.'); return; }
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(s => { if (s === 'granted') window.addEventListener('devicemotion', handleDeviceMotion); })
                    .catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleDeviceMotion);
            }
        }

        // ========== BLOQUEO DE ORIENTACIÓN (fire-and-forget, sin await) ==========
        async function lockOrientation() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('portrait');
                }
            } catch (err) {
                console.warn('No se pudo bloquear la orientación:', err);
            }
        }
        async function unlockOrientation() {
            try {
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                if (document.fullscreenElement) await document.exitFullscreen();
            } catch (err) { /* noop */ }
        }

        // ========== BOTÓN ON/OFF (sin await en la ruta de audio) ==========
        powerBtn.addEventListener('click', (e) => {
            e.preventDefault();

            if (powerOn) {
                // ---- APAGAR ----
                powerOn = false;
                powerBtn.classList.remove('on');
                powerBtn.innerText = 'OFF';
                if (masterGain && audioContext) {
                    const now = audioContext.currentTime;
                    const p = masterGain.gain;
                    holdParam(p, now);
                    p.linearRampToValueAtTime(0, now + VOLUME_RAMP_TIME);
                }
                unlockOrientation().catch(() => {});
                return;
            }

            // ---- ENCENDER ----
            powerOn = true;
            powerBtn.classList.add('on');
            powerBtn.innerText = 'ON';

            // 1) Lock de orientación sin bloquear la ruta de audio
            lockOrientation().catch(() => {});

            // 2) Grafo + resume (si ya se pre-calentó, resume() es instantáneo)
            createAudioGraph();
            if (audioContext.state !== 'running') {
                audioContext.resume().catch(console.warn); // no-await: no bloquea la rampa
            }

            // 3) Master gain con rampa corta (15 ms)
            const now = audioContext.currentTime;
            const p = masterGain.gain;
            holdParam(p, now);
            p.linearRampToValueAtTime(0.5, now + MASTER_RAMP_TIME);

            // 4) Listener de movimiento (idempotente)
            startMotionListener();
        });

        // ========== DIBUJO DEL SLIDER ==========
        function bezierPoint(t) {
            const mt = 1 - t;
            return {
                x: mt*mt * P0.x + 2 * mt * t * P1.x + t*t * P2.x,
                y: mt*mt * P0.y + 2 * mt * t * P1.y + t*t * P2.y
            };
        }

        function findTFromPoint(px, py) {
            let low = 0, high = 1;
            for (let i = 0; i < 10; i++) {
                const t1 = low + (high - low) / 3;
                const t2 = high - (high - low) / 3;
                const p1 = bezierPoint(t1), p2 = bezierPoint(t2);
                const d1 = Math.hypot(p1.x - px, p1.y - py);
                const d2 = Math.hypot(p2.x - px, p2.y - py);
                if (d1 < d2) high = t2; else low = t1;
            }
            return (low + high) / 2;
        }

        function drawSlider() {
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);

            ctx2d.beginPath();
            ctx2d.moveTo(P0.x, P0.y);
            ctx2d.quadraticCurveTo(P1.x, P1.y, P2.x, P2.y);
            ctx2d.strokeStyle = '#5f7b9c';
            ctx2d.lineWidth = 4;
            ctx2d.setLineDash([8, 8]);
            ctx2d.stroke();
            ctx2d.setLineDash([]);

            ctx2d.font = 'bold 14px "Segoe UI"';
            ctx2d.fillStyle = '#aab9d4';
            ctx2d.fillText('A7', 110, 160);
            ctx2d.fillText('D7', 220, 80);
            ctx2d.fillText('E7', 270, 20);

            const pos = bezierPoint(handleT);
            ctx2d.shadowColor = '#00000080';
            ctx2d.shadowBlur = 12;
            ctx2d.shadowOffsetY = 3;
            ctx2d.beginPath();
            ctx2d.arc(pos.x, pos.y, handleRadius, 0, 2 * Math.PI);
            ctx2d.fillStyle = '#f5c542';
            ctx2d.fill();

            ctx2d.shadowBlur = 6;
            ctx2d.beginPath();
            ctx2d.arc(pos.x, pos.y, handleRadius - 5, 0, 2 * Math.PI);
            ctx2d.fillStyle = '#ffec9e';
            ctx2d.fill();
            ctx2d.shadowColor = 'transparent';
        }

        // ========== DRAG DEL SLIDER ==========
        let isDragging = false;

        function localPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const p = localPoint(touch.clientX, touch.clientY);
            const h = bezierPoint(handleT);
            if (Math.hypot(p.x - h.x, p.y - h.y) <= handleRadius * 1.5) isDragging = true;
        }
        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            const touch = e.touches[0];
            const p = localPoint(touch.clientX, touch.clientY);
            handleT = Math.min(1, Math.max(0, findTFromPoint(p.x, p.y)));
            if (handleT < 0.33) setChord('A7');
            else if (handleT < 0.66) setChord('D7');
            else setChord('E7');
            drawSlider();
        }
        function handleTouchEnd(e) { e.preventDefault(); isDragging = false; }

        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const p = localPoint(e.clientX, e.clientY);
            const h = bezierPoint(handleT);
            if (Math.hypot(p.x - h.x, p.y - h.y) <= handleRadius * 1.5) isDragging = true;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const p = localPoint(e.clientX, e.clientY);
            handleT = Math.min(1, Math.max(0, findTFromPoint(p.x, p.y)));
            if (handleT < 0.33) setChord('A7');
            else if (handleT < 0.66) setChord('D7');
            else setChord('E7');
            drawSlider();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        drawSlider();
    })();
    </script>
</body>
</html>
